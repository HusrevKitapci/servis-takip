# Panel testleri API yanıtlarını taklit eder; veritabanına bağlanmaz.
name: Servis Takip Panel CI
on:
  push:
    paths:
      - 'panel/**'
      - '.github/workflows/panel.yml'
  pull_request:
    paths:
      - 'panel/**'
      - '.github/workflows/panel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  panel-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            panel/requirements.txt
            panel/requirements-dev.txt
      - name: Panel bağımlılıklarını kur
        run: python -m pip install -r panel/requirements-dev.txt
      - name: Panel testlerini çalıştır
        run: python -m pytest panel/tests -q --tb=short
